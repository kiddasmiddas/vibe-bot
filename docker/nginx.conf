# Заготовка nginx-конфига для prod-деплоя.
# Активируется в этапе деплоя; на этапе разработки бот работает по long-polling.
#
# Что должен делать:
#   1. Терминировать TLS (Let's Encrypt / certbot).
#   2. Проксировать webhook от Telegram на bot:<webhook port>.
#   3. Раздавать статику Mini App из /var/www/webapp (см. этап Mini App).
#   4. Проксировать /api/* на FastAPI (тот же контейнер bot).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;

    # TODO(deploy): включить gzip, security headers, rate-limiting на webhook.

    upstream bot_upstream {
        server bot:8080;
    }

    # TODO(deploy): server { listen 80; ... return 301 https; }
    # TODO(deploy): server { listen 443 ssl http2; ssl_certificate ...; }

    server {
        listen 80 default_server;
        server_name _;

        # Webhook от Telegram. Путь должен совпадать с WEBHOOK_PATH.
        location /webhook {
            proxy_pass http://bot_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # TODO(deploy): прокинуть X-Telegram-Bot-Api-Secret-Token явно.
        }

        # FastAPI для Mini App.
        location /api/ {
            proxy_pass http://bot_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Mini App static. Появится на этапе Mini App.
        # location /app/ {
        #     root /var/www;
        #     try_files $uri $uri/ /app/index.html;
        # }
    }
}
