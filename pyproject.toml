[project]
name = "vibe-bot"
version = "0.1.0"
description = "Telegram-бот для знакомств и общения по вайбу (anime / art / creative аудитория)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Vibe Bot Team" }]
license = { text = "Proprietary" }

dependencies = [
    "aiogram>=3.13",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "loguru>=0.7",
    "apscheduler>=3.10",
    "aiohttp>=3.9",
    "onnxruntime>=1.18",
    "pillow>=10.0",
    "numpy",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "uvicorn>=0.47.0",
    "python-multipart>=0.0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "alembic/versions",
    "webapp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode chars — у нас русские тексты
    "RUF002",
    "RUF003",
    "B008",   # FastAPI pattern: Depends/Header/Query in function defaults — ложное срабатывание
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
